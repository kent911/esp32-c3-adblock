name: Auto Update Blocklist

on:
  schedule:
    - cron: '0 2 * * 0' # Автозапуск каждое ВОСКРЕСЕНЬЕ в 02:00 ночи по Гринвичу
  workflow_dispatch:     # Кнопка для ручного запуска в любое время


jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Generate Fresh Blocklist
        run: |
          python tools/build_blocklist.py data/blocklist.bin

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/blocklist.bin
          git commit -m "Auto-update blocklist.bin" || echo "No changes to commit"
          git push
