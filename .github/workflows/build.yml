name: Auto Update Blocklist & Build Firmware

on:
  schedule:
    - cron: '0 2 * * 0' # Автозапуск каждое ВОСКРЕСЕНЬЕ в 02:00 ночи по Гринвичу
  workflow_dispatch:     # Кнопка для ручного запуска в любое время

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Fresh Blocklist
        run: |
          python tools/build_blocklist.py data/blocklist.bin

      - name: Commit and Push changes
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/blocklist.bin
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update blocklist.bin"
            git push
          fi

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        run: pio run

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-firmware
          path: .pio/build/*/firmware.bin
