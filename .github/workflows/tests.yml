name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: firmware core (native C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: make -C test test

  python:
    name: blocklist builder (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test deps
        run: pip install -r test/requirements.txt
      - name: Run unit tests
        run: python -m pytest test/python -q
